<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Free Fire Guild Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #00ff2a;
            --primary-dark: #00991a;
            --secondary: #1e1e1e;
            --accent: #fdcb6e;
            --background: #0a0a0a;
            --card-bg: rgba(30, 30, 30, 0.8);
            --text: #ffffff;
            --text-muted: #b0b0b0;
            --success: #2ecc71;
            --warning: #f39c12;
            --info: #3498db;
            --glow: 0 0 20px rgba(115, 255, 0, 0.3);
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 62, 62, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(253, 203, 110, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--glow);
        }

        .brand {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .tab-nav {
            display: flex;
            background: rgba(30, 30, 30, 0.6);
            border-radius: 15px;
            padding: 8px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 5px 15px rgba(255, 62, 62, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), var(--glow);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 255, 107, 0.2);
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 5px 15px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(119, 0, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #27ae60);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #e67e22);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, var(--info), #2980b9);
            color: white;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.success {
            background: rgba(46, 204, 113, 0.1);
            border-color: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
            display: block;
        }

        .result.error {
            background: rgba(231, 76, 60, 0.1);
            border-color: rgba(231, 76, 60, 0.3);
            color: #0099ff;
            display: block;
        }

        .result.info {
            background: rgba(52, 152, 219, 0.1);
            border-color: rgba(52, 152, 219, 0.3);
            color: #3498db;
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">⚡ WATASHII GUILD MANAGER</div>
            <div class="tagline">Manage Your Free Fire Guilds Like a Pro</div>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('join')">
                <i class="fas fa-user-plus"></i> Join Guild
            </button>
            <button class="tab-btn" onclick="switchTab('leave')">
                <i class="fas fa-sign-out-alt"></i> Leave Guild
            </button>
            <button class="tab-btn" onclick="switchTab('search')">
                <i class="fas fa-search"></i> Search Guild
            </button>
        </div>

        <!-- Join Guild Tab -->
        <div id="join-tab" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-user-plus"></i></div>
                    <div class="card-title">Join a Guild</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Clan ID *</label>
                    <input type="text" id="join-clan-id" class="form-input" placeholder="Enter Clan ID">
                </div>

                <div class="form-group">
                    <label class="form-label">JWT Token (Optional if UID/Password provided)</label>
                    <input type="text" id="join-jwt" class="form-input" placeholder="Enter JWT Token">
                </div>

                <div class="form-group">
                    <label class="form-label">UID (Optional if JWT provided)</label>
                    <input type="text" id="join-uid" class="form-input" placeholder="Enter UID">
                </div>

                <div class="form-group">
                    <label class="form-label">Password (Optional if JWT provided)</label>
                    <input type="password" id="join-password" class="form-input" placeholder="Enter Password">
                </div>

                <button class="btn btn-primary" onclick="joinGuild()">
                    <i class="fas fa-user-plus"></i> Join Guild
                </button>

                <div id="join-loading" class="loading">
                    <div class="spinner"></div>
                    <p>Processing request...</p>
                </div>

                <div id="join-result" class="result"></div>
            </div>
        </div>

        <!-- Leave Guild Tab -->
        <div id="leave-tab" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-sign-out-alt"></i></div>
                    <div class="card-title">Leave Current Guild</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">JWT Token (Optional if UID/Password provided)</label>
                    <input type="text" id="leave-jwt" class="form-input" placeholder="Enter JWT Token">
                </div>

                <div class="form-group">
                    <label class="form-label">UID (Optional if JWT provided)</label>
                    <input type="text" id="leave-uid" class="form-input" placeholder="Enter UID">
                </div>

                <div class="form-group">
                    <label class="form-label">Password (Optional if JWT provided)</label>
                    <input type="password" id="leave-password" class="form-input" placeholder="Enter Password">
                </div>

                <button class="btn btn-warning" onclick="leaveGuild()">
                    <i class="fas fa-sign-out-alt"></i> Leave Guild
                </button>

                <div id="leave-loading" class="loading">
                    <div class="spinner"></div>
                    <p>Processing request...</p>
                </div>

                <div id="leave-result" class="result"></div>
            </div>
        </div>

        <!-- Search Guild Tab -->
        <div id="search-tab" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-search"></i></div>
                    <div class="card-title">Search Guild Information</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Clan ID *</label>
                    <input type="text" id="search-clan-id" class="form-input" placeholder="Enter Clan ID">
                </div>

                <div class="form-group">
                    <label class="form-label">JWT Token (Optional if UID/Password provided)</label>
                    <input type="text" id="search-jwt" class="form-input" placeholder="Enter JWT Token">
                </div>

                <div class="form-group">
                    <label class="form-label">UID (Optional if JWT provided)</label>
                    <input type="text" id="search-uid" class="form-input" placeholder="Enter UID">
                </div>

                <div class="form-group">
                    <label class="form-label">Password (Optional if JWT provided)</label>
                    <input type="password" id="search-password" class="form-input" placeholder="Enter Password">
                </div>

                <button class="btn btn-info" onclick="searchGuild()">
                    <i class="fas fa-search"></i> Search Guild
                </button>

                <div id="search-loading" class="loading">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>

                <div id="search-result" class="result"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';  // same origin as the dashboard (works on Vercel and locally)

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        function showLoading(type) {
            document.getElementById(`${type}-loading`).style.display = 'block';
            document.getElementById(`${type}-result`).style.display = 'none';
        }

        function hideLoading(type) {
            document.getElementById(`${type}-loading`).style.display = 'none';
        }

        function showResult(type, message, status) {
            const resultDiv = document.getElementById(`${type}-result`);
            resultDiv.className = `result ${status}`;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }

        async function joinGuild() {
            const clanId = document.getElementById('join-clan-id').value.trim();
            const jwt = document.getElementById('join-jwt').value.trim();
            const uid = document.getElementById('join-uid').value.trim();
            const password = document.getElementById('join-password').value.trim();

            if (!clanId) {
                showResult('join', '<i class="fas fa-exclamation-circle"></i> Please enter a Clan ID', 'error');
                return;
            }

            if (!jwt && (!uid || !password)) {
                showResult('join', '<i class="fas fa-exclamation-circle"></i> Please provide either JWT token or UID/Password', 'error');
                return;
            }

            showLoading('join');

            try {
                const params = new URLSearchParams({ clan_id: clanId });
                if (jwt) params.append('jwt', jwt);
                if (uid) params.append('uid', uid);
                if (password) params.append('password', password);

                const response = await fetch(`${API_BASE}/join?${params}`);
                const data = await response.json();

                hideLoading('join');

                if (data.success) {
                    const message = `
                        <i class="fas fa-check-circle"></i> <strong>Successfully Joined!</strong><br><br>
                        <div class="info-row">
                            <span class="info-label">Clan ID:</span>
                            <span class="info-value">${data.clan_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Clan Name:</span>
                            <span class="info-value">${data.clan_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Clan Level:</span>
                            <span class="info-value">${data.clan_level}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Region:</span>
                            <span class="info-value">${data.region}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Status:</span>
                            <span class="info-value">${data.message}</span>
                        </div>
                    `;
                    showResult('join', message, 'success');
                } else {
                    const message = `
                        <i class="fas fa-times-circle"></i> <strong>Failed to Join</strong><br><br>
                        ${data.message || data.error || 'Unknown error'}<br>
                        Status Code: ${data.status_code || 'N/A'}
                    `;
                    showResult('join', message, 'error');
                }
            } catch (error) {
                hideLoading('join');
                showResult('join', `<i class="fas fa-exclamation-triangle"></i> <strong>Error:</strong> ${error.message}`, 'error');
            }
        }

        async function leaveGuild() {
            const jwt = document.getElementById('leave-jwt').value.trim();
            const uid = document.getElementById('leave-uid').value.trim();
            const password = document.getElementById('leave-password').value.trim();

            if (!jwt && (!uid || !password)) {
                showResult('leave', '<i class="fas fa-exclamation-circle"></i> Please provide either JWT token or UID/Password', 'error');
                return;
            }

            showLoading('leave');

            try {
                const params = new URLSearchParams();
                if (jwt) params.append('jwt', jwt);
                if (uid) params.append('uid', uid);
                if (password) params.append('password', password);

                const response = await fetch(`${API_BASE}/leave?${params}`);
                const data = await response.json();

                hideLoading('leave');

                if (data.success) {
                    const message = `
                        <i class="fas fa-check-circle"></i> <strong>Successfully Left!</strong><br><br>
                        <div class="info-row">
                            <span class="info-label">Region:</span>
                            <span class="info-value">${data.region}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Status:</span>
                            <span class="info-value">${data.message}</span>
                        </div>
                    `;
                    showResult('leave', message, 'success');
                } else {
                    const message = `
                        <i class="fas fa-times-circle"></i> <strong>Failed to Leave</strong><br><br>
                        ${data.message || data.error || 'Unknown error'}<br>
                        Status Code: ${data.status_code || 'N/A'}
                    `;
                    showResult('leave', message, 'error');
                }
            } catch (error) {
                hideLoading('leave');
                showResult('leave', `<i class="fas fa-exclamation-triangle"></i> <strong>Error:</strong> ${error.message}`, 'error');
            }
        }

        async function searchGuild() {
            const clanId = document.getElementById('search-clan-id').value.trim();
            const jwt = document.getElementById('search-jwt').value.trim();
            const uid = document.getElementById('search-uid').value.trim();
            const password = document.getElementById('search-password').value.trim();

            if (!clanId) {
                showResult('search', '<i class="fas fa-exclamation-circle"></i> Please enter a Clan ID', 'error');
                return;
            }

            if (!jwt && (!uid || !password)) {
                showResult('search', '<i class="fas fa-exclamation-circle"></i> Please provide either JWT token or UID/Password', 'error');
                return;
            }

            showLoading('search');

            try {
                const params = new URLSearchParams({ clan_id: clanId });
                if (jwt) params.append('jwt', jwt);
                if (uid) params.append('uid', uid);
                if (password) params.append('password', password);

                const response = await fetch(`${API_BASE}/search?${params}`);
                const data = await response.json();

                hideLoading('search');

                if (data.success) {
                    const message = `
                        <i class="fas fa-info-circle"></i> <strong>Guild Information</strong><br><br>
                        <div class="info-row">
                            <span class="info-label">Clan ID:</span>
                            <span class="info-value">${data.clan_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Clan Name:</span>
                            <span class="info-value">${data.clan_name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Clan Level:</span>
                            <span class="info-value">${data.clan_level}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Region:</span>
                            <span class="info-value">${data.region}</span>
                        </div>
                    `;
                    showResult('search', message, 'info');
                } else {
                    const message = `
                        <i class="fas fa-times-circle"></i> <strong>Search Failed</strong><br><br>
                        ${data.error || 'Unknown error'}
                    `;
                    showResult('search', message, 'error');
                }
            } catch (error) {
                hideLoading('search');
                showResult('search', `<i class="fas fa-exclamation-triangle"></i> <strong>Error:</strong> ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
